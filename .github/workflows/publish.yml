# Publishes cryptolike to npm when a version tag (v0.1.0, …) is pushed: trusted publishing (OIDC).
# No npm token exists anywhere: npm trusts this workflow of this repository and attaches provenance
# (public repository + GitHub-hosted runner).
#
# One-time setup by the package owner, after the first version exists on npm (published once by hand,
# with 2FA — npm configures trusted publishers only for an existing package): npmjs.com → cryptolike →
# Settings → Trusted publisher: GitHub Actions · organization Cryptolike-net · repository cryptolike-node ·
# workflow publish.yml · environment npm. Then Publishing access → "Require two-factor authentication and
# disallow tokens".
# The tag must equal package.json "version" (and src/version.ts — the test suite checks that).
#
# Only the last job holds the OIDC credential, and it runs no code of the package or of its dependencies:
# `npm ci` (install scripts of dev dependencies) and the build run in the jobs without id-token; the
# publish job takes the tarball built there and the pinned npm CLI only.
name: publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node: ["18", "22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: tag matches package.json version
        run: |
          want="v$(node -p 'require("./package.json").version')"
          [ "$want" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME, package.json says $want"; exit 1; }
      - run: npm ci
      - name: npm pack (prepack builds dist/)
        run: |
          mkdir pkg && npm pack --pack-destination pkg
          test -f "pkg/cryptolike-${GITHUB_REF_NAME#v}.tgz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: pkg/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      id-token: write # OIDC token for npm trusted publishing — the only credential of this job
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: pkg/
      - name: npm ≥ 11.5.1 (trusted publishing)
        run: |
          node -e 'const [a,b,c]=process.argv[1].split(".").map(Number);process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)' "$(npm --version)" \
            || npm install --global --ignore-scripts npm@11.5.1
          npm --version
      - name: version not on npm yet
        id: registry
        # The very first version is published once by the owner (npm offers a trusted publisher only for an
        # existing package); its tag then only re-runs the tests and the build here.
        run: |
          if npm view "cryptolike@${GITHUB_REF_NAME#v}" version >/dev/null 2>&1; then
            echo "::notice::cryptolike@${GITHUB_REF_NAME#v} is already on npm — nothing to publish"
            echo "published=1" >>"$GITHUB_OUTPUT"
          fi
      # A tarball is published as built: no lifecycle script runs here; npm attaches provenance. The "./" matters:
      # npm reads a bare "pkg/<tarball>" as the GitHub repository pkg/<tarball> (the v0.2.0 run failed with a git error).
      - run: npm publish --access public "./pkg/cryptolike-${GITHUB_REF_NAME#v}.tgz"
        if: steps.registry.outputs.published != '1'
